
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greatness</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0b0b;
            color: #f5f5f5;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 900px;
        }

        .quote {
            font-size: clamp(2.5rem, 6vw, 5.5rem);
            font-weight: 500;
            line-height: 1.08;
            letter-spacing: -0.04em;

            animation: fadeIn 1.5s ease-out;
        }

        .highlight {
            color: #888;
        }

        .line {
            width: 40px;
            height: 1px;
            background: #555;
            margin: 45px auto 0;

            animation: expand 1.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes expand {
            from {
                width: 0;
            }

            to {
                width: 40px;
            }
        }

        @media (max-width: 600px) {
            .quote {
                font-size: 2.6rem;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <h1 class="quote">
            Don't look for <span class="highlight">momentary satisfaction.</span>
            <br><br>
            You are meant for great.
        </h1>

        <div class="line"></div>
    </main>

</body>
</html>
